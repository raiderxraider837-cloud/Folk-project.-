
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkTrace</title>
<style>
:root {
  --bg:#0d0f14; --panel:#151922; --line:#232a38;
  --txt:#e7ecf3; --mut:#8b97a8; --acc:#4f8cff;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--txt);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
header {
  padding:20px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
h1 { margin:0; font-size:22px; }
h1 b { color:var(--acc); }
.sub,.meta,.empty { color:var(--mut); font-size:13px; }
header input { margin-left:auto; max-width:280px; }
main { max-width:820px; margin:auto; padding:20px; }
.card {
  background:var(--panel); border:1px solid var(--line);
  border-radius:12px; padding:18px; margin-bottom:18px;
}
h2 {
  margin:0 0 14px; font-size:14px; color:var(--mut);
  text-transform:uppercase; letter-spacing:.6px;
}
input {
  width:100%; padding:11px 13px; margin-bottom:10px;
  background:#0b0e13; border:1px solid var(--line);
  border-radius:9px; color:var(--txt); font-size:15px;
}
input:focus { outline:none; border-color:var(--acc); }
button {
  cursor:pointer; border:0; border-radius:9px;
  padding:11px 16px; font-size:14px; font-weight:600;
  background:var(--acc); color:white;
}
button:disabled { opacity:.5; cursor:wait; }
button.mini { padding:6px 10px; font-size:12px; background:#1d2431; }
button.danger { background:#2a1a1f; color:#ff9b9b; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.link-item {
  display:flex; justify-content:space-between; gap:12px;
  padding:13px 0; border-top:1px solid var(--line); flex-wrap:wrap;
}
.dest { font-weight:600; word-break:break-all; }
.short {
  color:var(--acc); font-family:monospace;
  font-size:13px; word-break:break-all;
}
.pill {
  background:#12203a; color:#8fb6ff; border-radius:20px;
  padding:3px 10px; font-size:12px; font-weight:600;
}
.big-link {
  margin-top:12px; font-family:monospace; background:#0b0e13;
  border:1px dashed var(--line); border-radius:9px;
  padding:12px; word-break:break-all; color:var(--acc);
}
#notice { margin-top:12px; color:var(--mut); }
#stats {
  position:fixed; inset:0; background:rgba(6,8,12,.8);
  display:none; padding:20px; overflow:auto; z-index:50;
}
#stats.on { display:block; }
#stats .card { max-width:820px; margin:20px auto; }
.close { float:right; }
</style>
</head>
<body>
<header>
  <h1>Link<b>Trace</b></h1>
  <span class="sub">Acortador de enlaces</span>
  <input id="base" readonly aria-label="Dominio de los enlaces">
</header>

<main>
  <section class="card">
    <h2>Crear un enlace</h2>
    <input id="dest" placeholder="https://ejemplo.com" autocomplete="url">
    <input id="label" placeholder="Etiqueta opcional" maxlength="100">
    <button id="create">Crear enlace</button>
    <div id="result"></div>
    <div id="notice" role="status"></div>
  </section>

  <section class="card">
    <h2>Mis enlaces <span id="count" class="meta"></span></h2>
    <div id="list"><div class="empty">Cargando enlaces...</div></div>
  </section>
</main>

<div id="stats">
  <section class="card">
    <button class="close mini" id="closeStats">Cerrar</button>
    <h2>Estadísticas del enlace</h2>
    <div id="statsBody"></div>
  </section>
</div>

<script>
const $ = selector => document.querySelector(selector);
let BASE = location.origin;

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  })[char]);
}

async function api(route, options = {}) {
  const response = await fetch(route, {
    ...options,
    headers: {
      'Content-Type':'application/json',
      ...(options.headers || {})
    }
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Error del servidor');
  return data;
}

async function copyLink(url) {
  try {
    await navigator.clipboard.writeText(url);
    $('#notice').textContent = 'Enlace copiado.';
  } catch (_) {
    prompt('Copia el enlace:', url);
  }
}

async function createLink() {
  const button = $('#create');
  const dest = $('#dest').value.trim();
  const label = $('#label').value.trim();

  if (!dest) {
    $('#dest').focus();
    return;
  }

  button.disabled = true;
  $('#notice').textContent = 'Creando enlace...';

  try {
    const data = await api('/api/links', {
      method:'POST',
      body:JSON.stringify({dest, label})
    });

    const link = data.url;
    $('#result').innerHTML =
      '<div class="big-link">' + esc(link) + '</div>' +
      '<button class="mini" id="copyNew" style="margin-top:10px">Copiar enlace</button>';

    $('#copyNew').onclick = () => copyLink(link);
    $('#dest').value = '';
    $('#label').value = '';
    $('#notice').textContent = 'Enlace creado.';
    await loadLinks();
  } catch (error) {
    $('#notice').textContent = error.message;
  } finally {
    button.disabled = false;
  }
}

async function loadLinks() {
  try {
    const links = await api('/api/links');
    $('#count').textContent = '(' + links.length + ')';

    if (!links.length) {
      $('#list').innerHTML = '<div class="empty">Todavía no hay enlaces.</div>';
      return;
    }

    $('#list').innerHTML = links.map(link => {
      const url = BASE + '/' + encodeURIComponent(link.code);
      return '<div class="link-item">' +
        '<div><div class="dest">' + esc(link.label || link.dest) + '</div>' +
        '<div class="short">' + esc(url) + '</div>' +
        '<div class="meta">' + esc(link.dest) + '</div>' +
        '<div class="meta">' + esc(new Date(link.created).toLocaleString()) + '</div></div>' +
        '<div class="row">' +
        '<span class="pill">' + Number(link.clicks || 0) + ' clics</span>' +
        '<button class="mini" data-copy="' + esc(link.code) + '">Copiar</button>' +
        '<button class="mini" data-stats="' + esc(link.code) + '">Ver</button>' +
        '<button class="mini danger" data-delete="' + esc(link.code) + '">Borrar</button>' +
        '</div></div>';
    }).join('');

    $('#list').querySelectorAll('[data-copy]').forEach(button => {
      button.onclick = () => copyLink(BASE + '/' + button.dataset.copy);
    });

    $('#list').querySelectorAll('[data-stats]').forEach(button => {
      button.onclick = () => showStats(button.dataset.stats);
    });

    $('#list').querySelectorAll('[data-delete]').forEach(button => {
      button.onclick = () => deleteLink(button.dataset.delete);
    });
  } catch (error) {
    $('#list').innerHTML = '<div class="empty">' + esc(error.message) + '</div>';
  }
}

async function showStats(code) {
  try {
    const link = await api('/api/links/' + encodeURIComponent(code));
    $('#statsBody').innerHTML =
      '<p><b>Etiqueta:</b> ' + esc(link.label || 'Sin etiqueta') + '</p>' +
      '<p><b>Destino:</b> ' + esc(link.dest) + '</p>' +
      '<p><b>Enlace:</b> ' + esc(link.url) + '</p>' +
      '<p><b>Clics totales:</b> ' + Number(link.clicks || 0) + '</p>' +
      '<p class="meta">Solo se cuenta el número de clics; no se muestra información personal de los visitantes.</p>';
    $('#stats').classList.add('on');
  } catch (error) {
    $('#notice').textContent = error.message;
  }
}

async function deleteLink(code) {
  if (!confirm('¿Borrar este enlace?')) return;

  try {
    await api('/api/links/' + encodeURIComponent(code), {method:'DELETE'});
    $('#notice').textContent = 'Enlace borrado.';
    await loadLinks();
  } catch (error) {
    $('#notice').textContent = error.message;
  }
}

$('#create').addEventListener('click', createLink);
$('#dest').addEventListener('keydown', event => {
  if (event.key === 'Enter') createLink();
});
$('#closeStats').addEventListener('click', () => {
  $('#stats').classList.remove('on');
});
$('#stats').addEventListener('click', event => {
  if (event.target.id === 'stats') $('#stats').classList.remove('on');
});

(async () => {
  try {
    const config = await api('/api/config');
    BASE = config.base || location.origin;
    $('#base').value = BASE;
    await loadLinks();
  } catch (error) {
    $('#notice').textContent = 'No se pudo conectar con el servidor: ' + error.message;
  }
})();
</script>
</body>
</html>
